<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestãoHair | Agendamentos</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-sistema">

    <div class="layout-sistema">
        <aside class="sidebar">
            <a href="dashboard.html" class="logo-sistema">
                <span class="logo-icone">GH</span>
                <span>GestãoHair</span>
            </a>

            <nav class="menu-lateral" aria-label="Menu principal">
                <a href="dashboard.html" class="item-menu">Dashboard</a>
                <a href="clientes.html" class="item-menu">Clientes</a>
                <a href="produtos.html" class="item-menu">Produtos</a>
                <a href="agendamentos.html" class="item-menu ativo">Agendamentos</a>
                <a href="wireframes.html" class="item-menu">Wireframes</a>
            </nav>

            <button class="botao-sair" id="btnSair" type="button">
                Sair
            </button>
        </aside>

        <main class="conteudo-sistema">
            <header class="topo-pagina">
                <div>
                    <p class="texto-superior">AGENDA</p>
                    <h1>Agendamentos</h1>
                    <p class="subtitulo-pagina">
                        Organize os atendimentos e acompanhe a agenda do salão.
                    </p>
                </div>
            </header>

            <section class="painel painel-formulario">
                <div class="cabecalho-painel">
                    <div>
                        <p class="texto-superior">NOVO AGENDAMENTO</p>
                        <h2>Adicionar atendimento</h2>
                    </div>
                </div>

                <form id="formAgendamento" class="formulario-grade" novalidate>
                    <div class="campo">
                        <label for="clienteAgendamento">Cliente</label>
                        <select id="clienteAgendamento">
                            <option value="">Selecione o cliente</option>
                            <option value="Mariana Costa">Mariana Costa</option>
                            <option value="Juliana Santos">Juliana Santos</option>
                            <option value="Carla Oliveira">Carla Oliveira</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="servicoAgendamento">Serviço</label>
                        <select id="servicoAgendamento">
                            <option value="">Selecione o serviço</option>
                            <option value="Corte feminino">Corte feminino</option>
                            <option value="Corte masculino">Corte masculino</option>
                            <option value="Coloração completa">Coloração completa</option>
                            <option value="Escova">Escova</option>
                            <option value="Manicure e pedicure">Manicure e pedicure</option>
                            <option value="Hidratação capilar">Hidratação capilar</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="profissionalAgendamento">Profissional</label>
                        <select id="profissionalAgendamento">
                            <option value="">Selecione o profissional</option>
                            <option value="Ana Paula">Ana Paula</option>
                            <option value="Beatriz Lima">Beatriz Lima</option>
                            <option value="Camila Souza">Camila Souza</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="statusAgendamento">Status</label>
                        <select id="statusAgendamento">
                            <option value="Confirmado">Confirmado</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Concluído">Concluído</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="dataAgendamento">Data</label>
                        <input type="date" id="dataAgendamento">
                    </div>

                    <div class="campo">
                        <label for="horaAgendamento">Horário</label>
                        <input
                            type="time"
                            id="horaAgendamento"
                            min="08:00"
                            max="20:00"
                        >
                    </div>

                    <div class="campo-completo area-formulario">
                        <p id="mensagemAgendamento" class="mensagem" aria-live="polite"></p>

                        <button type="submit" class="botao-principal botao-formulario">
                            Salvar agendamento
                        </button>
                    </div>
                </form>
            </section>

            <section class="painel">
                <div class="cabecalho-painel">
                    <div>
                        <p class="texto-superior">AGENDA DO SALÃO</p>
                        <h2>Próximos agendamentos</h2>
                    </div>

                    <span class="contador-registros" id="contadorAgendamentos">
                        3 agendamentos
                    </span>
                </div>

                <div class="tabela-responsiva">
                    <table class="tabela-dados">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Horário</th>
                                <th>Cliente</th>
                                <th>Serviço</th>
                                <th>Profissional</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="listaAgendamentos">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
